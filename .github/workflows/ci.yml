name: Three Tier CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: write
  security-events: write

jobs:

  # =========================
  # Backend
  # =========================
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run tests
        working-directory: backend
        run: pytest || test $? -eq 5


  # =========================
  # Frontend
  # =========================
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build


  # =========================
  # Secret Scanning
  # =========================
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # =========================
  # Dependency Security
  # =========================
  dependency-security:
    name: Dependency Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Python dependencies
        working-directory: backend
        run: pip-audit -r requirements.txt

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit npm dependencies
        working-directory: frontend
        run: npm audit --audit-level=high


  # =========================
  # SAST
  # =========================
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest

    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Semgrep
        run: semgrep scan --config auto


  # =========================
  # Kubernetes Security
  # =========================
  checkov:
    name: Checkov
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: kubernetes,helm,dockerfile
          output_format: sarif
          output_file_path: results.sarif
          soft_fail: true

      - name: Upload Checkov SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif


  # =========================
  # Build + Scan + Push
  # =========================
  docker:
    name: Docker Build Scan and Push
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend
      - gitleaks
      - dependency-security
      - semgrep
      - checkov

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::6}" >> $GITHUB_ENV

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # =========================
      # Build Images
      # =========================

      - name: Build backend image
        run: |
          docker build \
            -t ayyandar/three-tier-backend:${{ env.IMAGE_TAG }} \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            -t ayyandar/three-tier-frontend:${{ env.IMAGE_TAG }} \
            ./frontend

      # =========================
      # Trivy Scan
      # =========================

      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ayyandar/three-tier-backend:${{ env.IMAGE_TAG }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ayyandar/three-tier-frontend:${{ env.IMAGE_TAG }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # =========================
      # Push Images
      # =========================

      - name: Push backend image
        run: |
          docker push ayyandar/three-tier-backend:${{ env.IMAGE_TAG }}

      - name: Push frontend image
        run: |
          docker push ayyandar/three-tier-frontend:${{ env.IMAGE_TAG }}

      # =========================
      # Update Helm
      # =========================

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update Helm image tags
        run: |
          yq -i \
            '.images.backend.tag = "${{ env.IMAGE_TAG }}" |
             .images.frontend.tag = "${{ env.IMAGE_TAG }}"' \
            helm/three-tier-app/values.yaml

      - name: Commit Helm changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/three-tier-app/values.yaml

          git diff --cached --quiet || \
            git commit -m "chore: update images to ${{ env.IMAGE_TAG }} [skip ci]"

          git push
